# =============================================================================
# Koopman MPC 默认配置（v4 / ONNX / H=200）
# 供 loadMpcConfigFromYaml() 与 ship_control 部署参考
# =============================================================================

# 预测步数 H，须与 ONNX pred_len 一致（20s @ dt=0.1 → 200）
horizon: 200
# 仅优化前 N 步控制；后续零阶保持（建议 20~60）
opt_control_steps: 20
# 离散时间步长 (s)
dt: 0.1
# 控制块长度：每 N 个细步共用一个控制量（10 × 0.1s = 1s 变一次）
control_hold_steps: 10
# control_period: 1.0   # 可选，等价于 control_hold_steps = round(period/dt)

# --- 代价权重 ---
w_xy: 10.0      # 位置 (x,y)
w_yaw: 5.0      # 航向 yaw
w_vel: 0.5      # 速度 (u,v,r)
w_u: 0.0001     # 控制幅值
w_du: 0.05      # 控制增量（全局默认）
w_du_throttle: 0.05   # 油门通道 (0,2) 增量软惩罚
w_du_rudder: 0.08     # 舵角通道 (1,3) 增量软惩罚

# 每步最大控制变化量（硬约束，单位与 u 一致；<=0 表示不限制）
# 通道顺序：[左油门, 左舵角, 右油门, 右舵角]
throttle_du_max: 15.0
rudder_du_max: 3.5
# du_max: [15.0, 3.5, 15.0, 3.5]  # 可选：逐通道覆盖上面分组

# --- 优化器 ---
opt_iters: 8    # Adam 迭代次数
opt_lr: 0.08    # 学习率

# 4 维控制上下界（与训练数据一致）
u_min: [-100.0, -35.0, -100.0, -35.0]
u_max: [100.0, 35.0, 100.0, 35.0]

# --- motion.cpp 桥接（MotionBridgeConfig，代码中单独设置）---
motion_ref_dt: 0.1              # = mpc_during
motion_ref_time_offset: 0.5   # PointChange 采样偏置

# ONNX 权重路径（部署时可改为绝对路径）
onnx_path: cpp/koopman_mpc/weights/koopman_rollout.onnx
