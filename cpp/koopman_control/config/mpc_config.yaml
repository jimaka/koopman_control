# Koopman MPC 控制库（v4 / ONNX）
horizon: 200
opt_control_steps: 40
dt: 0.1
w_xy: 10.0
w_yaw: 5.0
w_vel: 0.5
w_u: 0.0001
w_du: 0.05
opt_iters: 15
opt_lr: 0.05
u_min: [-100.0, -35.0, -100.0, -35.0]
u_max: [100.0, 35.0, 100.0, 35.0]

# motion.cpp 桥接：PointChange 参考点时间轴
motion_ref_dt: 0.1
motion_ref_time_offset: 0.5

# ONNX 权重路径（相对仓库根目录或绝对路径）
onnx_path: cpp/koopman_mpc/weights/koopman_rollout.onnx
